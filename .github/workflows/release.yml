name: Release installer

on:
  push:
    tags: ["v*"]

jobs:
  test:
    # A tag must never publish an installer that the suite has not passed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pyside6 pyqtgraph openpyxl
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Full suite (fake DAQ)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[gui,excel] pyinstaller
      - name: Extract version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'src'); import ni_usb6009_logger; print(ni_usb6009_logger.__version__)"
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build PyInstaller bundle
        run: pyinstaller packaging/ni_usb6009_gui.spec --noconfirm --distpath dist --workpath build
      - name: Optionally fetch NI-DAQmx redistributable
        shell: pwsh
        env:
          NIDAQMX_URL: ${{ vars.NIDAQMX_URL }}
        run: |
          if ($env:NIDAQMX_URL) {
            New-Item -ItemType Directory -Force packaging/nidaqmx | Out-Null
            Invoke-WebRequest -Uri $env:NIDAQMX_URL -OutFile packaging/nidaqmx/nidaqmx_setup.exe
          } else {
            Write-Host "NIDAQMX_URL not set: installer ships without the driver component;"
            Write-Host "the app's driver-detection dialog guides the user instead."
          }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          # SourceDir is relative to packaging\installer.iss; PyInstaller wrote
          # to the repo-root dist\. /DNiDaqSetup is only passed when the
          # redistributable was actually downloaded, otherwise ISCC would fail
          # on a missing source file.
          $isccArgs = @(
            "/DAppVersion=$env:APP_VERSION",
            '/DSourceDir=..\dist\NI6009Logger'
          )
          if (Test-Path packaging/nidaqmx/nidaqmx_setup.exe) {
            $isccArgs += '/DNiDaqSetup=nidaqmx\nidaqmx_setup.exe'
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @isccArgs packaging/installer.iss
      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/NI6009Logger_Setup_*.exe
