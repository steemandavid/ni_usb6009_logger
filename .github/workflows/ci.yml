name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest flake8
      - name: Lint (core + cli)
        run: flake8 --max-line-length=120 --extend-ignore=E203,W503 src/ni_usb6009_logger/core src/ni_usb6009_logger/cli.py src/ni_usb6009_logger/_fake_nidaqmx.py
      - name: Core + CLI tests (fake DAQ)
        run: pytest tests/test_cli_parity.py tests/test_sessions_fake_daq.py tests/test_core_sessions.py -q

  gui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pyside6 pyqtgraph openpyxl
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Offscreen GUI tests (fake DAQ)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_gui_smoke.py -q
