name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest flake8
      - name: Lint (whole package, .flake8 config)
        run: flake8 src
      - name: Core + CLI tests (fake DAQ)
        # Named explicitly: this job has no Qt installed, so the GUI tests run
        # in the gui-test job below. Any new non-GUI test file must be added
        # here or, better, kept under tests/ and picked up by `pytest` there.
        run: pytest tests --ignore=tests/test_gui_smoke.py -q

  gui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pyside6 pyqtgraph openpyxl
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Offscreen GUI tests (fake DAQ)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
